name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd flaskapp
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Check imports
      run: |
        cd flaskapp
        python -c "
        try:
            import flask
            import numpy
            import matplotlib
            import PIL
            print('All imports successful')
        except ImportError as e:
            print(f'Import error: {e}')
            exit(1)
        "
    
    - name: Test application structure
      run: |
        echo "Checking project structure..."
        [ -f "flaskapp/app.py" ] && echo "app.py: OK" || echo "app.py: MISSING"
        [ -f "flaskapp/requirements.txt" ] && echo "requirements.txt: OK" || echo "requirements.txt: MISSING"
        [ -d "flaskapp/templates" ] && echo "templates/: OK" || echo "templates/: MISSING"
        [ -d "flaskapp/static" ] && echo "static/: OK" || echo "static/: MISSING"
    
    - name: Test Flask app
      run: |
        cd flaskapp
        mkdir -p static/uploads static/plots
        timeout 10 python app.py &
        sleep 5
        curl -f http://localhost:5000/ && echo "Flask app: OK" || (echo "Flask app: ERROR" && exit 1)